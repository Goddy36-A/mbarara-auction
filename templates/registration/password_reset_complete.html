{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
{% if form %}<form method="post" novalidate>{% csrf_token %}{{ form|crispy }}<button type="submit" class="btn btn-primary">Submit</button></form>
{% else %}<p>Check the on-screen instructions to continue.</p>{% endif %}
</div></div>
{% endblock %}
