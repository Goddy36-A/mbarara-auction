services:
  - type: web
    name: mbarara-auction
    runtime: python
    region: oregon
    plan: free

    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 120

    healthCheckPath: /

    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production

      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: DATABASE_URL
        fromDatabase:
          name: mbarara-auction-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: redis
          name: mbarara-auction-redis
          property: connectionString

  - type: redis
    name: mbarara-auction-redis
    region: oregon
    plan: free
    ipAllowList: []

databases:
  - name: mbarara-auction-db
    databaseName: mbarara_auction
    user: auction_user
    plan: free
    region: oregon
